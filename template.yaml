AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: aws-study - multi-Lambda TypeScript scaffold (SAM)

Globals:
  Function:
    Runtime: nodejs22.x
    # arm64 = native on Apple Silicon (fast, stable `sam local`) and
    # Graviton in AWS (cheaper). Pure-TS bundles are arch-independent.
    # If you need x86_64 (e.g. a Layer without arm64 builds), change this
    # back — but expect slow/flaky emulation on Apple Silicon.
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: aws-study

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-health"
      # CodeUri is the project root so the esbuild builder finds the
      # root package.json and bundles node_modules deps correctly.
      CodeUri: ./
      Handler: app.handler
      Description: Health check endpoint (GET /health)
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/health/app.ts

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-hello"
      # CodeUri is the project root so the esbuild builder finds the
      # root package.json and bundles node_modules deps correctly.
      CodeUri: ./
      Handler: app.handler
      Description: Example endpoint (GET /hello)
      Events:
        HelloApi:
          Type: Api
          Properties:
            Path: /hello
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/hello/app.ts

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-products"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-products"
      CodeUri: ./
      Handler: app.handler
      Description: Products CRUD backed by DynamoDB
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Events:
        CreateProductApi:
          Type: Api
          Properties:
            Path: /products
            Method: post
        ListProductsApi:
          Type: Api
          Properties:
            Path: /products
            Method: get
        GetProductApi:
          Type: Api
          Properties:
            Path: /products/{id}
            Method: get
        UpdateProductApi:
          Type: Api
          Properties:
            Path: /products/{id}
            Method: put
        DeleteProductApi:
          Type: Api
          Properties:
            Path: /products/{id}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/products/app.ts

Outputs:
  ApiUrl:
    Description: Base URL of the API Gateway
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  HealthFunctionArn:
    Description: Health Lambda ARN
    Value: !GetAtt HealthFunction.Arn
  HelloFunctionArn:
    Description: Hello Lambda ARN
    Value: !GetAtt HelloFunction.Arn
  ProductsTableName:
    Description: DynamoDB products table name
    Value: !Ref ProductsTable
  ProductsFunctionArn:
    Description: Products Lambda ARN
    Value: !GetAtt ProductsFunction.Arn
