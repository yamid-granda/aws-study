name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - run: npm ci
      - run: npx biome check .
      - run: npm run typecheck
      - run: npm run test:unit
      - run: sam build
      - run: sam validate --lint
